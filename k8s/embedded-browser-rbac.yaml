# RBAC for the Lastest app pod to provision on-demand EB Jobs.
# Scope is namespace-local — no cluster-wide rights.
#
# Single-container topology only (root Dockerfile — app process also runs the
# EB pool service in-process). In the split-services topology (Dockerfile.app
# + packages/pool-service/Dockerfile), the pool service runs as its own
# Deployment and k8s/pool-service.yaml carries the equivalent RBAC bound to
# that pod instead (under its own object names — lastest-pool-eb-provisioner —
# because same-named RoleBindings across the two files would collide under
# kubectl apply) — the app pod itself then needs none of this. k3d-up.sh
# still applies this file for local dev-cluster parity.
#
# Apply once per environment:
#   kubectl apply -n lastest -f k8s/embedded-browser-rbac.yaml
#
# The single-container app deployment must then set
# `serviceAccountName: lastest-app`. (Required — the namespace default SA is
# token-denied, see k8s/namespace.yaml. The split-topology app pod in
# k8s/app.yaml does NOT need this: it provisions via the pool service and is
# deliberately tokenless.)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lastest-app
  namespace: lastest
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lastest-eb-provisioner
  namespace: lastest
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lastest-eb-provisioner
  namespace: lastest
subjects:
  - kind: ServiceAccount
    name: lastest-app
    namespace: lastest
roleRef:
  kind: Role
  name: lastest-eb-provisioner
  apiGroup: rbac.authorization.k8s.io

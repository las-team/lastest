# Reference template for a single on-demand Embedded Browser Job.
#
# The pool service provisioner (packages/pool-service/src/provisioner.ts) constructs the spec
# programmatically via the Kubernetes REST API, but this file documents the
# exact shape and is usable for manual `kubectl apply` during bring-up / debug.
#
# Key invariants:
#   - One Job per browser per test (1 test per EB).
#   - restartPolicy: Never  + backoffLimit: 0  → no retry loops on failure.
#   - ttlSecondsAfterFinished cleans up finished Jobs automatically.
#   - activeDeadlineSeconds hard-caps runtime (prevents stuck pods).
#   - /dev/shm is mounted as a 512Mi memory emptyDir — Chromium crashes under
#     load on the default 64Mi /dev/shm.
#
# Replace INSTANCE_ID + EB_BOOTSTRAP_TOKEN + STREAM_AUTH_TOKEN placeholders
# before applying manually (mint them via the pool service, or use a
# static-fleet SYSTEM_EB_TOKEN env instead when no pool service exists).
# LASTEST_URL points at the host's pnpm dev via the k3d CoreDNS pin installed
# by scripts/k3d-up.sh — change it to a Service DNS name in production
# (Olares) where the app runs in-cluster.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eb-INSTANCE_ID
  namespace: lastest
  labels:
    app: lastest-eb
    lastest.dev/eb-instance: INSTANCE_ID
spec:
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 60
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: lastest-eb
        lastest.dev/eb-instance: INSTANCE_ID
    spec:
      restartPolicy: Never
      # EBs run untrusted user/AI-authored test code and need no access to the
      # Kubernetes API — never mount the namespace default ServiceAccount
      # token (mirrors the provisioner in packages/pool-service/src/provisioner.ts).
      automountServiceAccountToken: false
      # Mirror the image's non-root pwuser (uid 1001) at the orchestrator layer.
      # The EB image's Dockerfile sets USER pwuser; this locks it down so a
      # misconfigured image rebuild can't silently run untrusted web content
      # + user test code as root with Chromium un-sandboxed.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
      containers:
        - name: embedded-browser
          image: lastest-embedded-browser:latest
          imagePullPolicy: IfNotPresent
          # Forbid privilege escalation and drop all capabilities. pwuser
          # already can't gain root; making it explicit keeps the EB locked
          # down even if the namespace SA is over-permissioned.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: LASTEST_URL
              value: "http://host.k3d.internal:3000"
            # Per-session credential minted by the pool service at provision
            # time (packages/pool-service/src/common.ts). Dynamic pods never
            # receive the fleet-wide SYSTEM_EB_TOKEN.
            - name: EB_BOOTSTRAP_TOKEN
              value: "REPLACE_ME"
            # Credential for the WebSocket stream port, derived per instance
            # from ENCRYPTION_KEY (deriveStreamAuthToken in
            # packages/pool-service/src/common.ts). The front proxy re-derives
            # it from the signed grant, so it never crosses the network.
            - name: STREAM_AUTH_TOKEN
              value: "REPLACE_ME"
            - name: INSTANCE_ID
              value: "INSTANCE_ID"
            - name: STREAM_PORT
              value: "9223"
            - name: CDP_PORT
              value: "9222"
          ports:
            - containerPort: 9222
              name: cdp
            - containerPort: 9223
              name: stream
            - containerPort: 9224
              name: health
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /health
              port: 9224
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 9224
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
